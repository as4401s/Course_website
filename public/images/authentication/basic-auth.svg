<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" role="img" aria-labelledby="title desc"><title id="title">01 / Basic authentication</title><desc id="desc">1. Client to Server: Request a protected page. No credentials yet. 2. Server to Client: 401: credentials needed. WWW-Authenticate: Basic. 3. Client to Client: Collect username + password. Encode the pair with Base64. 4. Client to Server: Send credentials with request. Authorization: Basic &lt;encoded pair&gt;. 5. Server to Server: Decode and check credentials. Verify against the stored password hash. 6. Server to Client: Return the result. 200 if allowed · 401 if credentials fail.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="830" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="830" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">01 / BASIC AUTHENTICATION</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="87.0" y="87" width="266" height="78" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.4"/><g transform="translate(103.0 104) scale(0.85)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="233" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="233" dy="0">Client</tspan></text><text x="220" y="146" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">Browser or script</tspan></text><path d="M220,166 L220,755" fill="none" stroke="#79baff" stroke-width="2" stroke-dasharray="6 6"/><rect x="767.0" y="87" width="266" height="78" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.4"/><g transform="translate(783.0 104) scale(0.85)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="913" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="913" dy="0">Server</tspan></text><text x="900" y="146" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="900" dy="0">Protected endpoint</tspan></text><path d="M900,166 L900,755" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6"/><path d="M220,257 L892,257" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="244.0" y="210" width="632" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="229" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">Request a protected page</tspan></text><text x="560.0" y="247" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">No credentials yet</tspan></text><circle cx="220" cy="257" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="220" y="262" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="220" dy="0">1</tspan></text><path d="M900,353 L228,353" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="244.0" y="306" width="632" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="325" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">401: credentials needed</tspan></text><text x="560.0" y="343" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">WWW-Authenticate: Basic</tspan></text><circle cx="900" cy="353" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="900" y="358" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="900" dy="0">2</tspan></text><rect x="87.0" y="381" width="266" height="89" rx="10" fill="#182631" stroke="#3d5462" stroke-width="1"/><text x="220" y="404" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="220" dy="0">Collect username +</tspan><tspan x="220" dy="21">password</tspan></text><text x="220" y="446" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">Encode the pair with Base64</tspan></text><circle cx="97.0" cy="386" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="97.0" y="391" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="97.0" dy="0">3</tspan></text><path d="M220,545 L892,545" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="244.0" y="498" width="632" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="517" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">Send credentials with request</tspan></text><text x="560.0" y="535" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">Authorization: Basic &lt;encoded pair&gt;</tspan></text><circle cx="220" cy="545" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="220" y="550" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="220" dy="0">4</tspan></text><rect x="767.0" y="573" width="266" height="89" rx="10" fill="#182631" stroke="#3d5462" stroke-width="1"/><text x="900" y="596" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="900" dy="0">Decode and check</tspan><tspan x="900" dy="21">credentials</tspan></text><text x="900" y="638" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="900" dy="0">Verify against the stored password</tspan><tspan x="900" dy="17">hash</tspan></text><circle cx="777.0" cy="578" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="777.0" y="583" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="777.0" dy="0">5</tspan></text><path d="M900,737 L228,737" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="244.0" y="690" width="632" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="709" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">Return the result</tspan></text><text x="560.0" y="727" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">200 if allowed · 401 if credentials fail</tspan></text><circle cx="900" cy="737" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="900" y="742" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="900" dy="0">6</tspan></text><rect x="32" y="781" width="1056" height="32" rx="8" fill="#192933" stroke="#304653" stroke-width="1"/><text x="560" y="802" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Base64 is reversible encoding. HTTPS provides protection in transit.</tspan></text></g></svg>