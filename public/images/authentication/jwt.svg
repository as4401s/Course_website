<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 711" width="1120" height="711" role="img" aria-labelledby="title desc"><title id="title">06 / a signed JWT: issue, carry, verify</title><desc id="desc">An issuer signs claims, a client carries the JWT, and the API validates it. The common signed token contains a header, a readable payload, and a signature. The receiver must validate signature, issuer, audience, expiry, and permissions.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="711" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="711" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">06 / A SIGNED JWT: ISSUE, CARRY, VERIFY</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="44" y="98" width="250" height="87" rx="14" fill="#423420" stroke="#efc16e" stroke-width="1.5"/><g transform="translate(60 120) scale(0.95)" stroke="#efc16e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 1L26 6V14C26 22 14 28 14 28S2 22 2 14V6Z"/><path d="M8 14l4 4 8-9"/></g><text x="184" y="132" fill="#ecf3f8" font-size="21" font-weight="600" text-anchor="middle"><tspan x="184" dy="0">Issuer</tspan></text><text x="169" y="160" fill="#efc16e" font-size="13" font-weight="400" text-anchor="middle"><tspan x="169" dy="0">Signs with private key</tspan></text><rect x="435" y="98" width="250" height="87" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.5"/><g transform="translate(451 120) scale(0.95)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="575" y="132" fill="#ecf3f8" font-size="21" font-weight="600" text-anchor="middle"><tspan x="575" dy="0">Client</tspan></text><text x="560" y="160" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Carries the token</tspan></text><rect x="826" y="98" width="250" height="87" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.5"/><g transform="translate(842 120) scale(0.95)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="966" y="132" fill="#ecf3f8" font-size="21" font-weight="600" text-anchor="middle"><tspan x="966" dy="0">API</tspan></text><text x="951" y="160" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="951" dy="0">Verifies with public key</tspan></text><path d="M297,141 L430,141" fill="none" stroke="#efc16e" stroke-width="2" marker-end="url(#arr-efc16e)"/><text x="364" y="122" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="364" dy="0">1  Issue JWT</tspan></text><path d="M688,141 L821,141" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><text x="755" y="116" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="755" dy="0">2  Bearer</tspan></text><text x="755" y="132" fill="#aabcc8" font-size="12" font-weight="400" text-anchor="middle"><tspan x="755" dy="0">API request</tspan></text><rect x="44" y="239" width="641" height="296" rx="14" fill="#15242e" stroke="#344b5a" stroke-width="1.4"/><text x="65" y="269" fill="#aabcc8" font-size="13" font-weight="600" text-anchor="start"><tspan x="65" dy="0">INSIDE THE COMMON SIGNED FORM</tspan></text><rect x="62" y="291" width="189" height="80" rx="10" fill="#183b60" stroke="#79baff" stroke-width="1"/><text x="156.5" y="323" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="156.5" dy="0">HEADER</tspan></text><text x="156.5" y="348" fill="#ecf3f8" font-size="12" font-weight="400" text-anchor="middle"><tspan x="156.5" dy="0">Algorithm + type</tspan></text><rect x="268" y="291" width="189" height="80" rx="10" fill="#423420" stroke="#efc16e" stroke-width="1"/><text x="362.5" y="323" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="362.5" dy="0">PAYLOAD</tspan></text><text x="362.5" y="348" fill="#ecf3f8" font-size="12" font-weight="400" text-anchor="middle"><tspan x="362.5" dy="0">Claims about the subject</tspan></text><rect x="474" y="291" width="189" height="80" rx="10" fill="#352949" stroke="#c8a3f1" stroke-width="1"/><text x="568.5" y="323" fill="#c8a3f1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="568.5" dy="0">SIGNATURE</tspan></text><text x="568.5" y="348" fill="#ecf3f8" font-size="12" font-weight="400" text-anchor="middle"><tspan x="568.5" dy="0">Detects tampering</tspan></text><text x="259" y="338" fill="#aabcc8" font-size="27" font-weight="600" text-anchor="middle"><tspan x="259" dy="0">.</tspan></text><text x="465" y="338" fill="#aabcc8" font-size="27" font-weight="600" text-anchor="middle"><tspan x="465" dy="0">.</tspan></text><text x="66" y="407" fill="#ecf3f8" font-size="15" font-weight="600" text-anchor="start"><tspan x="66" dy="0">Example claims</tspan></text><text x="66" y="437" fill="#aabcc8" font-size="16" font-weight="400" text-anchor="start"><tspan x="66" dy="0">sub: u42      Who this token refers to</tspan></text><text x="66" y="464" fill="#aabcc8" font-size="16" font-weight="400" text-anchor="start"><tspan x="66" dy="0">aud: reports-api      Intended receiver</tspan></text><text x="66" y="491" fill="#aabcc8" font-size="16" font-weight="400" text-anchor="start"><tspan x="66" dy="0">exp: …      Time after which it expires</tspan></text><path d="M951,185 L951,234" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="733" y="239" width="343" height="296" rx="14" fill="#15302d" stroke="#437764" stroke-width="1.4"/><text x="904.5" y="276" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="904.5" dy="0">3  Validate before trusting</tspan></text><text x="756" y="321" fill="#6cdbb1" font-size="17" font-weight="600" text-anchor="start"><tspan x="756" dy="0">✓</tspan></text><text x="785" y="321" fill="#ecf3f8" font-size="14" font-weight="400" text-anchor="start"><tspan x="785" dy="0">Trusted signature + algorithm</tspan></text><text x="756" y="365" fill="#6cdbb1" font-size="17" font-weight="600" text-anchor="start"><tspan x="756" dy="0">✓</tspan></text><text x="785" y="365" fill="#ecf3f8" font-size="14" font-weight="400" text-anchor="start"><tspan x="785" dy="0">Correct issuer and audience</tspan></text><text x="756" y="409" fill="#6cdbb1" font-size="17" font-weight="600" text-anchor="start"><tspan x="756" dy="0">✓</tspan></text><text x="785" y="409" fill="#ecf3f8" font-size="14" font-weight="400" text-anchor="start"><tspan x="785" dy="0">Valid expiry / time claims</tspan></text><text x="756" y="453" fill="#6cdbb1" font-size="17" font-weight="600" text-anchor="start"><tspan x="756" dy="0">✓</tspan></text><text x="785" y="453" fill="#ecf3f8" font-size="14" font-weight="400" text-anchor="start"><tspan x="785" dy="0">Permission for this operation</tspan></text><rect x="44" y="568" width="641" height="91" rx="12" fill="#302b24" stroke="#8c7046" stroke-width="1"/><text x="66" y="603" fill="#efc16e" font-size="19" font-weight="600" text-anchor="start"><tspan x="66" dy="0">Readable payload ≠ encrypted payload</tspan></text><text x="66" y="635" fill="#ecf3f8" font-size="15" font-weight="400" text-anchor="start"><tspan x="66" dy="0">A signature protects integrity; decoding alone proves nothing.</tspan></text><rect x="733" y="568" width="343" height="91" rx="12" fill="#422c36" stroke="#f397a8" stroke-width="1"/><text x="904.5" y="603" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="middle"><tspan x="904.5" dy="0">Any required check fails?</tspan></text><text x="904.5" y="635" fill="#f397a8" font-size="14" font-weight="400" text-anchor="middle"><tspan x="904.5" dy="0">Reject the token or deny the action.</tspan></text><text x="560" y="690" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Asymmetric signing is illustrated. JWT also supports other protected forms.</tspan></text></g></svg>