<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 734" width="1120" height="734" role="img" aria-labelledby="title desc"><title id="title">03 / API keys</title><desc id="desc">1. Your backend to API gateway: Call the API with a key. X-API-Key: &lt;secret&gt;. 2. API gateway to Key registry: Check the key. Active? Correct API? Allowed caller?. 3. Key registry to API gateway: Return key information. Account / project and restrictions. 4. API gateway to API gateway: Apply service rules. Permissions, quotas and rate limits. 5. API gateway to Your backend: Return data or reject. Only permitted requests proceed.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="734" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="734" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">03 / API KEYS</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="52.0" y="87" width="266" height="78" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.4"/><g transform="translate(68.0 104) scale(0.85)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="198" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="198" dy="0">Your backend</tspan></text><text x="185" y="146" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="185" dy="0">Holds the secret key</tspan></text><path d="M185,166 L185,659" fill="none" stroke="#79baff" stroke-width="2" stroke-dasharray="6 6"/><rect x="427.0" y="87" width="266" height="78" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.4"/><g transform="translate(443.0 104) scale(0.85)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="573" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="573" dy="0">API gateway</tspan></text><text x="560" y="146" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Receives the request</tspan></text><path d="M560,166 L560,659" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6"/><rect x="802.0" y="87" width="266" height="78" rx="14" fill="#352949" stroke="#c8a3f1" stroke-width="1.4"/><g transform="translate(818.0 104) scale(0.85)" stroke="#c8a3f1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="5" rx="12" ry="4"/><path d="M2 5V23 C2 29 26 29 26 23V5 M2 14C2 20 26 20 26 14"/></g><text x="948" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="948" dy="0">Key registry</tspan></text><text x="935" y="146" fill="#c8a3f1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="935" dy="0">Key + restrictions</tspan></text><path d="M935,166 L935,659" fill="none" stroke="#c8a3f1" stroke-width="2" stroke-dasharray="6 6"/><path d="M185,257 L552,257" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="209.0" y="210" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="229" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Call the API with a key</tspan></text><text x="372.5" y="247" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">X-API-Key: &lt;secret&gt;</tspan></text><circle cx="185" cy="257" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="185" y="262" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">1</tspan></text><path d="M560,353 L927,353" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="584.0" y="306" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="325" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Check the key</tspan></text><text x="747.5" y="343" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Active? Correct API? Allowed caller?</tspan></text><circle cx="560" cy="353" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="358" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">2</tspan></text><path d="M935,449 L568,449" fill="none" stroke="#c8a3f1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-c8a3f1)"/><rect x="584.0" y="402" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="421" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Return key information</tspan></text><text x="747.5" y="439" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Account / project and restrictions</tspan></text><circle cx="935" cy="449" r="15" fill="#101922" stroke="#c8a3f1" stroke-width="2"/><text x="935" y="454" fill="#c8a3f1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">3</tspan></text><rect x="427.0" y="477" width="266" height="89" rx="10" fill="#182631" stroke="#3d5462" stroke-width="1"/><text x="560" y="500" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560" dy="0">Apply service rules</tspan></text><text x="560" y="521" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Permissions, quotas and rate limits</tspan></text><circle cx="437.0" cy="482" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="437.0" y="487" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="437.0" dy="0">4</tspan></text><path d="M560,641 L193,641" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="209.0" y="594" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="613" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Return data or reject</tspan></text><text x="372.5" y="631" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Only permitted requests proceed</tspan></text><circle cx="560" cy="641" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="646" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">5</tspan></text><rect x="32" y="685" width="1056" height="32" rx="8" fill="#192933" stroke="#304653" stroke-width="1"/><text x="560" y="706" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">The key is provisioned before this flow. Header names vary by provider.</tspan></text></g></svg>