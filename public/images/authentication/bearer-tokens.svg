<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" role="img" aria-labelledby="title desc"><title id="title">05 / Bearer tokens</title><desc id="desc">1. Token service to Client: Issue an access token. After an approved login or grant. 2. Client to Protected API: Call the API. Authorization: Bearer &lt;token&gt;. 3. Protected API to Token service: Check an opaque token. Ask the issuer: is it active?. 4. Token service to Protected API: Return token information. Validity, audience and granted scope. 5. Protected API to Protected API: Check this action is permitted. A valid token is not unlimited access. 6. Protected API to Client: Return data or reject. Invalid token: 401 · insufficient scope: 403.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="830" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="830" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">05 / BEARER TOKENS</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="52.0" y="87" width="266" height="78" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.4"/><g transform="translate(68.0 104) scale(0.85)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="198" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="198" dy="0">Client</tspan></text><text x="185" y="146" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="185" dy="0">Holds the access token</tspan></text><path d="M185,166 L185,755" fill="none" stroke="#79baff" stroke-width="2" stroke-dasharray="6 6"/><rect x="427.0" y="87" width="266" height="78" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.4"/><g transform="translate(443.0 104) scale(0.85)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="573" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="573" dy="0">Protected API</tspan></text><text x="560" y="146" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Enforces permissions</tspan></text><path d="M560,166 L560,755" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6"/><rect x="802.0" y="87" width="266" height="78" rx="14" fill="#423420" stroke="#efc16e" stroke-width="1.4"/><g transform="translate(818.0 104) scale(0.85)" stroke="#efc16e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 1L26 6V14C26 22 14 28 14 28S2 22 2 14V6Z"/><path d="M8 14l4 4 8-9"/></g><text x="948" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="948" dy="0">Token service</tspan></text><text x="935" y="146" fill="#efc16e" font-size="13" font-weight="400" text-anchor="middle"><tspan x="935" dy="0">Issuer / introspection</tspan></text><path d="M935,166 L935,755" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6"/><path d="M935,257 L193,257" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-efc16e)"/><rect x="241.5" y="210" width="637" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="229" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">Issue an access token</tspan></text><text x="560.0" y="247" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">After an approved login or grant</tspan></text><circle cx="935" cy="257" r="15" fill="#101922" stroke="#efc16e" stroke-width="2"/><text x="935" y="262" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">1</tspan></text><path d="M185,353 L552,353" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="209.0" y="306" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="325" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Call the API</tspan></text><text x="372.5" y="343" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Authorization: Bearer &lt;token&gt;</tspan></text><circle cx="185" cy="353" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="185" y="358" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">2</tspan></text><path d="M560,449 L927,449" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="584.0" y="402" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="421" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Check an opaque token</tspan></text><text x="747.5" y="439" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Ask the issuer: is it active?</tspan></text><circle cx="560" cy="449" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="454" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">3</tspan></text><path d="M935,545 L568,545" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-efc16e)"/><rect x="584.0" y="498" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="517" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Return token information</tspan></text><text x="747.5" y="535" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Validity, audience and granted scope</tspan></text><circle cx="935" cy="545" r="15" fill="#101922" stroke="#efc16e" stroke-width="2"/><text x="935" y="550" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">4</tspan></text><rect x="427.0" y="573" width="266" height="89" rx="10" fill="#182631" stroke="#3d5462" stroke-width="1"/><text x="560" y="596" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560" dy="0">Check this action is</tspan><tspan x="560" dy="21">permitted</tspan></text><text x="560" y="638" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">A valid token is not unlimited access</tspan></text><circle cx="437.0" cy="578" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="437.0" y="583" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="437.0" dy="0">5</tspan></text><path d="M560,737 L193,737" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="209.0" y="690" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="709" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Return data or reject</tspan></text><text x="372.5" y="727" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Invalid token: 401 · insufficient scope: 403</tspan></text><circle cx="560" cy="737" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="742" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">6</tspan></text><rect x="32" y="781" width="1056" height="32" rx="8" fill="#192933" stroke="#304653" stroke-width="1"/><text x="560" y="802" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Opaque-token example shown. A JWT can instead be verified locally.</tspan></text></g></svg>