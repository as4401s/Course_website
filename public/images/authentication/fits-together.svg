<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-labelledby="title desc"><title id="title">Putting it together / one app can use several of these</title><desc id="desc">A browser signs in via OIDC at a shared identity provider. An app backend creates a session cookie, keeps access tokens server-side, and uses an access token to call a protected API. Other apps can reuse the identity provider session for SSO.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="480" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="480" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">PUTTING IT TOGETHER / ONE APP CAN USE SEVERAL OF THESE</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="50" y="130" width="245" height="93" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.5"/><text x="172.5" y="168" fill="#ecf3f8" font-size="20" font-weight="600" text-anchor="middle"><tspan x="172.5" dy="0">Browser</tspan></text><text x="172.5" y="198" fill="#79baff" font-size="14" font-weight="400" text-anchor="middle"><tspan x="172.5" dy="0">Session cookie</tspan></text><rect x="436" y="130" width="248" height="93" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.5"/><text x="560.0" y="168" fill="#ecf3f8" font-size="20" font-weight="600" text-anchor="middle"><tspan x="560.0" dy="0">App backend</tspan></text><text x="560.0" y="198" fill="#6cdbb1" font-size="14" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">Session + token handling</tspan></text><rect x="824" y="130" width="245" height="93" rx="14" fill="#423420" stroke="#efc16e" stroke-width="1.5"/><text x="946.5" y="168" fill="#ecf3f8" font-size="20" font-weight="600" text-anchor="middle"><tspan x="946.5" dy="0">Identity provider</tspan></text><text x="946.5" y="198" fill="#efc16e" font-size="14" font-weight="400" text-anchor="middle"><tspan x="946.5" dy="0">OIDC sign-in</tspan></text><rect x="436" y="337" width="248" height="93" rx="14" fill="#352949" stroke="#c8a3f1" stroke-width="1.5"/><text x="560.0" y="375" fill="#ecf3f8" font-size="20" font-weight="600" text-anchor="middle"><tspan x="560.0" dy="0">Protected API</tspan></text><text x="560.0" y="405" fill="#c8a3f1" font-size="14" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">Validate + authorize</tspan></text><path d="M296,177 L429,177" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><text x="366" y="146" fill="#aabcc8" font-size="14" font-weight="400" text-anchor="middle"><tspan x="366" dy="0">Cookie</tspan></text><path d="M686,177 L817,177" fill="none" stroke="#efc16e" stroke-width="2" marker-end="url(#arr-efc16e)"/><text x="752" y="126" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="752" dy="0">OIDC code /</tspan></text><text x="752" y="147" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="752" dy="0">token exchange</tspan></text><path d="M560,224 L560,330" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><text x="580" y="269" fill="#ecf3f8" font-size="16" font-weight="400" text-anchor="start"><tspan x="580" dy="0">Access token</tspan></text><text x="580" y="294" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="start"><tspan x="580" dy="0">JWT or opaque</tspan></text><text x="70" y="317" fill="#79baff" font-size="15" font-weight="600" text-anchor="start"><tspan x="70" dy="0">SSO</tspan></text><text x="70" y="347" fill="#aabcc8" font-size="14" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Other apps can reuse the</tspan></text><text x="70" y="372" fill="#aabcc8" font-size="14" font-weight="400" text-anchor="start"><tspan x="70" dy="0">provider’s login session.</tspan></text><text x="824" y="299" fill="#efc16e" font-size="14" font-weight="400" text-anchor="start"><tspan x="824" dy="0">ID token: identity for the app</tspan></text><text x="824" y="329" fill="#efc16e" font-size="14" font-weight="400" text-anchor="start"><tspan x="824" dy="0">Refresh token: renewal</tspan></text><text x="824" y="365" fill="#aabcc8" font-size="12" font-weight="400" text-anchor="start"><tspan x="824" dy="0">Browser redirects are omitted</tspan></text><text x="824" y="388" fill="#aabcc8" font-size="12" font-weight="400" text-anchor="start"><tspan x="824" dy="0">from this architecture view.</tspan></text><text x="560" y="461" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Illustrative backend-for-frontend design: API tokens remain on the backend.</tspan></text></g></svg>