<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1022" width="1120" height="1022" role="img" aria-labelledby="title desc"><title id="title">08 / OAuth 2.0</title><desc id="desc">1. Client app to Browser: Redirect to provider. Scope + state + PKCE challenge. 2. Browser to Auth server: Sign in and approve access. Example: read calendar. 3. Auth server to Browser: Redirect with a one-time code. Return state to the callback URL. 4. Browser to Client app: Deliver code to app callback. App checks the returned state. 5. Client app to Auth server: Exchange code + PKCE verifier. Client authentication where required. 6. Auth server to Client app: Return access token. Refresh token if issued. 7. Client app to Resource API: Call API with access token. Only the granted scope applies. 8. Resource API to Client app: Return permitted calendar data. Reject unauthorized operations.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="1022" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="1022" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">08 / OAUTH 2.0</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="29.0" y="87" width="232" height="78" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.4"/><g transform="translate(45.0 104) scale(0.85)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="158" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="158" dy="0">Browser</tspan></text><text x="145" y="146" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="145" dy="0">User’s interaction</tspan></text><path d="M145,166 L145,947" fill="none" stroke="#79baff" stroke-width="2" stroke-dasharray="6 6"/><rect x="305.0" y="87" width="232" height="78" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.4"/><g transform="translate(321.0 104) scale(0.85)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="434" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="434" dy="0">Client app</tspan></text><text x="421" y="146" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="421" dy="0">App requesting access</tspan></text><path d="M421,166 L421,947" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6"/><rect x="581.0" y="87" width="232" height="78" rx="14" fill="#423420" stroke="#efc16e" stroke-width="1.4"/><g transform="translate(597.0 104) scale(0.85)" stroke="#efc16e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 1L26 6V14C26 22 14 28 14 28S2 22 2 14V6Z"/><path d="M8 14l4 4 8-9"/></g><text x="710" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="710" dy="0">Auth server</tspan></text><text x="697" y="146" fill="#efc16e" font-size="13" font-weight="400" text-anchor="middle"><tspan x="697" dy="0">Provider login + consent</tspan></text><path d="M697,166 L697,947" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6"/><rect x="857.0" y="87" width="232" height="78" rx="14" fill="#352949" stroke="#c8a3f1" stroke-width="1.4"/><g transform="translate(873.0 104) scale(0.85)" stroke="#c8a3f1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="5" rx="12" ry="4"/><path d="M2 5V23 C2 29 26 29 26 23V5 M2 14C2 20 26 20 26 14"/></g><text x="986" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="986" dy="0">Resource API</tspan></text><text x="973" y="146" fill="#c8a3f1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="973" dy="0">For example, calendar</tspan></text><path d="M973,166 L973,947" fill="none" stroke="#c8a3f1" stroke-width="2" stroke-dasharray="6 6"/><path d="M421,257 L153,257" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="169.0" y="210" width="228" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="283.0" y="229" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="283.0" dy="0">Redirect to provider</tspan></text><text x="283.0" y="247" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="283.0" dy="0">Scope + state + PKCE challenge</tspan></text><circle cx="421" cy="257" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="421" y="262" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="421" dy="0">1</tspan></text><path d="M145,353 L689,353" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="169.0" y="306" width="504" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="421.0" y="325" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="421.0" dy="0">Sign in and approve access</tspan></text><text x="421.0" y="343" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="421.0" dy="0">Example: read calendar</tspan></text><circle cx="145" cy="353" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="145" y="358" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="145" dy="0">2</tspan></text><path d="M697,449 L153,449" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-efc16e)"/><rect x="169.0" y="402" width="504" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="421.0" y="421" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="421.0" dy="0">Redirect with a one-time code</tspan></text><text x="421.0" y="439" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="421.0" dy="0">Return state to the callback URL</tspan></text><circle cx="697" cy="449" r="15" fill="#101922" stroke="#efc16e" stroke-width="2"/><text x="697" y="454" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="697" dy="0">3</tspan></text><path d="M145,545 L413,545" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="169.0" y="477" width="228" height="62" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="283.0" y="496" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="283.0" dy="0">Deliver code to app</tspan><tspan x="283.0" dy="21">callback</tspan></text><text x="283.0" y="535" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="283.0" dy="0">App checks the returned state</tspan></text><circle cx="145" cy="545" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="145" y="550" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="145" dy="0">4</tspan></text><path d="M421,641 L689,641" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="445.0" y="556" width="228" height="79" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="559.0" y="575" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="559.0" dy="0">Exchange code + PKCE</tspan><tspan x="559.0" dy="21">verifier</tspan></text><text x="559.0" y="614" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="559.0" dy="0">Client authentication where</tspan><tspan x="559.0" dy="17">required</tspan></text><circle cx="421" cy="641" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="421" y="646" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="421" dy="0">5</tspan></text><path d="M697,737 L429,737" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-efc16e)"/><rect x="445.0" y="690" width="228" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="559.0" y="709" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="559.0" dy="0">Return access token</tspan></text><text x="559.0" y="727" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="559.0" dy="0">Refresh token if issued</tspan></text><circle cx="697" cy="737" r="15" fill="#101922" stroke="#efc16e" stroke-width="2"/><text x="697" y="742" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="697" dy="0">6</tspan></text><path d="M421,833 L965,833" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="445.0" y="786" width="504" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="697.0" y="805" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="697.0" dy="0">Call API with access token</tspan></text><text x="697.0" y="823" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="697.0" dy="0">Only the granted scope applies</tspan></text><circle cx="421" cy="833" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="421" y="838" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="421" dy="0">7</tspan></text><path d="M973,929 L429,929" fill="none" stroke="#c8a3f1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-c8a3f1)"/><rect x="445.0" y="882" width="504" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="697.0" y="901" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="697.0" dy="0">Return permitted calendar data</tspan></text><text x="697.0" y="919" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="697.0" dy="0">Reject unauthorized operations</tspan></text><circle cx="973" cy="929" r="15" fill="#101922" stroke="#c8a3f1" stroke-width="2"/><text x="973" y="934" fill="#c8a3f1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="973" dy="0">8</tspan></text><rect x="32" y="973" width="1056" height="32" rx="8" fill="#192933" stroke="#304653" stroke-width="1"/><text x="560" y="994" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Authorization Code + PKCE shown. The provider password stays at the provider.</tspan></text></g></svg>