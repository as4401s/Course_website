<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1022" width="1120" height="1022" role="img" aria-labelledby="title desc"><title id="title">09 / OpenID Connect (OIDC)</title><desc id="desc">1. Your app to Browser: Redirect to identity provider. openid scope + state + nonce + PKCE. 2. Browser to Identity provider: Authenticate with the provider. Password, passkey or MFA as configured. 3. Identity provider to Browser: Redirect with authorization code. To the registered app callback. 4. Browser to Your app: Deliver code + state. App checks the login transaction. 5. Your app to Identity provider: Exchange code + PKCE verifier. Client authentication where required. 6. Identity provider to Your app: Return ID token + access token. ID token contains identity claims. 7. Your app to Your app: Validate the ID token. Signature, issuer, audience, expiry, nonce. 8. Your app to Browser: Create the app’s own session. For example: a secure session cookie.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="1022" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="1022" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">09 / OPENID CONNECT (OIDC)</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="52.0" y="87" width="266" height="78" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.4"/><g transform="translate(68.0 104) scale(0.85)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="198" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="198" dy="0">Browser</tspan></text><text x="185" y="146" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="185" dy="0">Begins provider sign-in</tspan></text><path d="M185,166 L185,947" fill="none" stroke="#79baff" stroke-width="2" stroke-dasharray="6 6"/><rect x="427.0" y="87" width="266" height="78" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.4"/><g transform="translate(443.0 104) scale(0.85)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="573" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="573" dy="0">Your app</tspan></text><text x="560" y="146" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Relying party / backend</tspan></text><path d="M560,166 L560,947" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6"/><rect x="802.0" y="87" width="266" height="78" rx="14" fill="#423420" stroke="#efc16e" stroke-width="1.4"/><g transform="translate(818.0 104) scale(0.85)" stroke="#efc16e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 1L26 6V14C26 22 14 28 14 28S2 22 2 14V6Z"/><path d="M8 14l4 4 8-9"/></g><text x="948" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="948" dy="0">Identity provider</tspan></text><text x="935" y="146" fill="#efc16e" font-size="13" font-weight="400" text-anchor="middle"><tspan x="935" dy="0">Authenticates the user</tspan></text><path d="M935,166 L935,947" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6"/><path d="M560,257 L193,257" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="209.0" y="210" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="229" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Redirect to identity provider</tspan></text><text x="372.5" y="247" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">openid scope + state + nonce + PKCE</tspan></text><circle cx="560" cy="257" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="262" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">1</tspan></text><path d="M185,353 L927,353" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="241.5" y="306" width="637" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="325" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">Authenticate with the provider</tspan></text><text x="560.0" y="343" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">Password, passkey or MFA as configured</tspan></text><circle cx="185" cy="353" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="185" y="358" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">2</tspan></text><path d="M935,449 L193,449" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-efc16e)"/><rect x="241.5" y="402" width="637" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="560.0" y="421" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560.0" dy="0">Redirect with authorization code</tspan></text><text x="560.0" y="439" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560.0" dy="0">To the registered app callback</tspan></text><circle cx="935" cy="449" r="15" fill="#101922" stroke="#efc16e" stroke-width="2"/><text x="935" y="454" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">3</tspan></text><path d="M185,545 L552,545" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="209.0" y="498" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="517" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Deliver code + state</tspan></text><text x="372.5" y="535" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">App checks the login transaction</tspan></text><circle cx="185" cy="545" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="185" y="550" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">4</tspan></text><path d="M560,641 L927,641" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="584.0" y="594" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="613" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Exchange code + PKCE verifier</tspan></text><text x="747.5" y="631" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Client authentication where required</tspan></text><circle cx="560" cy="641" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="646" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">5</tspan></text><path d="M935,737 L568,737" fill="none" stroke="#efc16e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-efc16e)"/><rect x="584.0" y="690" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="709" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Return ID token + access token</tspan></text><text x="747.5" y="727" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">ID token contains identity claims</tspan></text><circle cx="935" cy="737" r="15" fill="#101922" stroke="#efc16e" stroke-width="2"/><text x="935" y="742" fill="#efc16e" font-size="14" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">6</tspan></text><rect x="427.0" y="765" width="266" height="89" rx="10" fill="#182631" stroke="#3d5462" stroke-width="1"/><text x="560" y="788" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="560" dy="0">Validate the ID token</tspan></text><text x="560" y="809" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Signature, issuer, audience, expiry,</tspan><tspan x="560" dy="17">nonce</tspan></text><circle cx="437.0" cy="770" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="437.0" y="775" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="437.0" dy="0">7</tspan></text><path d="M560,929 L193,929" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="209.0" y="882" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="901" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Create the app’s own session</tspan></text><text x="372.5" y="919" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">For example: a secure session cookie</tspan></text><circle cx="560" cy="929" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="934" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">8</tspan></text><rect x="32" y="973" width="1056" height="32" rx="8" fill="#192933" stroke="#304653" stroke-width="1"/><text x="560" y="994" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">ID token → your app. Access token → its intended API. They have different jobs.</tspan></text></g></svg>