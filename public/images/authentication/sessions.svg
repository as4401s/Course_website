<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 926" width="1120" height="926" role="img" aria-labelledby="title desc"><title id="title">04 / Session-based authentication</title><desc id="desc">1. Browser to Web server: Sign in once. Credentials or another login method. 2. Web server to Session store: Create a session after login. Random ID → user + expiry. 3. Web server to Browser: Set the session cookie. Secure; HttpOnly; SameSite. 4. Browser to Web server: Request another page. Browser automatically sends the cookie. 5. Web server to Session store: Look up the session ID. Is the session still valid?. 6. Session store to Web server: Return the session record. User identity + session state. 7. Web server to Browser: Return the authorized page. Invalid session → sign in again.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="926" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="926" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">04 / SESSION-BASED AUTHENTICATION</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="52.0" y="87" width="266" height="78" rx="14" fill="#183b60" stroke="#79baff" stroke-width="1.4"/><g transform="translate(68.0 104) scale(0.85)" stroke="#79baff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="17" rx="3"/><path d="M8 24H20 M14 18V24"/></g><text x="198" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="198" dy="0">Browser</tspan></text><text x="185" y="146" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="185" dy="0">Holds a cookie</tspan></text><path d="M185,166 L185,851" fill="none" stroke="#79baff" stroke-width="2" stroke-dasharray="6 6"/><rect x="427.0" y="87" width="266" height="78" rx="14" fill="#153f35" stroke="#6cdbb1" stroke-width="1.4"/><g transform="translate(443.0 104) scale(0.85)" stroke="#6cdbb1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="25" height="10" rx="3"/><rect x="1" y="16" width="25" height="10" rx="3"/><path d="M5 6h1 M5 21h1"/></g><text x="573" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="573" dy="0">Web server</tspan></text><text x="560" y="146" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Handles the login</tspan></text><path d="M560,166 L560,851" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6"/><rect x="802.0" y="87" width="266" height="78" rx="14" fill="#352949" stroke="#c8a3f1" stroke-width="1.4"/><g transform="translate(818.0 104) scale(0.85)" stroke="#c8a3f1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="5" rx="12" ry="4"/><path d="M2 5V23 C2 29 26 29 26 23V5 M2 14C2 20 26 20 26 14"/></g><text x="948" y="119" fill="#ecf3f8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="948" dy="0">Session store</tspan></text><text x="935" y="146" fill="#c8a3f1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="935" dy="0">Remembers the user</tspan></text><path d="M935,166 L935,851" fill="none" stroke="#c8a3f1" stroke-width="2" stroke-dasharray="6 6"/><path d="M185,257 L552,257" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="209.0" y="210" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="229" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Sign in once</tspan></text><text x="372.5" y="247" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Credentials or another login method</tspan></text><circle cx="185" cy="257" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="185" y="262" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">1</tspan></text><path d="M560,353 L927,353" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="584.0" y="306" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="325" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Create a session after login</tspan></text><text x="747.5" y="343" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Random ID → user + expiry</tspan></text><circle cx="560" cy="353" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="358" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">2</tspan></text><path d="M560,449 L193,449" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="209.0" y="402" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="421" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Set the session cookie</tspan></text><text x="372.5" y="439" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Secure; HttpOnly; SameSite</tspan></text><circle cx="560" cy="449" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="454" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">3</tspan></text><path d="M185,545 L552,545" fill="none" stroke="#79baff" stroke-width="2" marker-end="url(#arr-79baff)"/><rect x="209.0" y="498" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="517" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Request another page</tspan></text><text x="372.5" y="535" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Browser automatically sends the cookie</tspan></text><circle cx="185" cy="545" r="15" fill="#101922" stroke="#79baff" stroke-width="2"/><text x="185" y="550" fill="#79baff" font-size="14" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">4</tspan></text><path d="M560,641 L927,641" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><rect x="584.0" y="594" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="613" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Look up the session ID</tspan></text><text x="747.5" y="631" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Is the session still valid?</tspan></text><circle cx="560" cy="641" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="646" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">5</tspan></text><path d="M935,737 L568,737" fill="none" stroke="#c8a3f1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-c8a3f1)"/><rect x="584.0" y="690" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="747.5" y="709" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="747.5" dy="0">Return the session record</tspan></text><text x="747.5" y="727" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">User identity + session state</tspan></text><circle cx="935" cy="737" r="15" fill="#101922" stroke="#c8a3f1" stroke-width="2"/><text x="935" y="742" fill="#c8a3f1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">6</tspan></text><path d="M560,833 L193,833" fill="none" stroke="#6cdbb1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr-6cdbb1)"/><rect x="209.0" y="786" width="327" height="41" rx="5" fill="#101922" stroke="#101922" stroke-width="0"/><text x="372.5" y="805" fill="#ecf3f8" font-size="17" font-weight="500" text-anchor="middle"><tspan x="372.5" dy="0">Return the authorized page</tspan></text><text x="372.5" y="823" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="372.5" dy="0">Invalid session → sign in again</tspan></text><circle cx="560" cy="833" r="15" fill="#101922" stroke="#6cdbb1" stroke-width="2"/><text x="560" y="838" fill="#6cdbb1" font-size="14" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">7</tspan></text><rect x="32" y="877" width="1056" height="32" rx="8" fill="#192933" stroke="#304653" stroke-width="1"/><text x="560" y="898" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Logout: invalidate the server session and clear the browser cookie.</tspan></text></g></svg>