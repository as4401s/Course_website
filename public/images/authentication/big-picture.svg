<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 455" width="1120" height="455" role="img" aria-labelledby="title desc"><title id="title">Start here / identity first, permissions next</title><desc id="desc">A request first passes an identity check. Invalid credentials lead to 401. A valid identity then faces an authorization check. Insufficient permission leads to 403; sufficient permission allows the action.</desc><defs><marker id="arr-f397a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f397a8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-79baff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#79baff" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-6cdbb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6cdbb1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-aabcc8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aabcc8" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-efc16e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#efc16e" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-c8a3f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8a3f1" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="arr-ecf3f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ecf3f8" stroke-width="1.6" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#abc2d2" opacity="0.11"/></pattern></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="455" rx="18" fill="#101922" stroke="#101922" stroke-width="0"/><rect width="1120" height="455" fill="url(#dots)"/><text x="32" y="41" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="start"><tspan x="32" dy="0">START HERE / IDENTITY FIRST, PERMISSIONS NEXT</tspan></text><rect x="949" y="21" width="139" height="31" rx="15" fill="#192e31" stroke="#355255" stroke-width="1"/><text x="1018.5" y="42" fill="#8ee0c3" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1018.5" dy="0">HTTPS / TLS</tspan></text><path d="M32,61 L1088,61" fill="none" stroke="#304452" stroke-width="2"/><rect x="45" y="155" width="185" height="90" rx="13" fill="#183b60" stroke="#79baff" stroke-width="1.5"/><text x="137.5" y="193" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="middle"><tspan x="137.5" dy="0">Request</tspan></text><text x="137.5" y="220" fill="#79baff" font-size="13" font-weight="400" text-anchor="middle"><tspan x="137.5" dy="0">Browser / service</tspan></text><rect x="322" y="155" width="230" height="90" rx="13" fill="#423420" stroke="#efc16e" stroke-width="1.5"/><text x="437.0" y="193" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="middle"><tspan x="437.0" dy="0">1  Check identity</tspan></text><text x="437.0" y="220" fill="#efc16e" font-size="13" font-weight="400" text-anchor="middle"><tspan x="437.0" dy="0">Authentication</tspan></text><rect x="647" y="155" width="230" height="90" rx="13" fill="#423420" stroke="#efc16e" stroke-width="1.5"/><text x="762.0" y="193" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="middle"><tspan x="762.0" dy="0">2  Check permission</tspan></text><text x="762.0" y="220" fill="#efc16e" font-size="13" font-weight="400" text-anchor="middle"><tspan x="762.0" dy="0">Authorization</tspan></text><rect x="968" y="155" width="112" height="90" rx="13" fill="#153f35" stroke="#6cdbb1" stroke-width="1.5"/><text x="1024.0" y="193" fill="#ecf3f8" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1024.0" dy="0">Allow</tspan></text><text x="1024.0" y="220" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1024.0" dy="0">Run action</tspan></text><path d="M231,200 L316,200" fill="none" stroke="#aabcc8" stroke-width="2" marker-end="url(#arr-aabcc8)"/><path d="M553,200 L640,200" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><text x="598" y="183" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="598" dy="0">Valid</tspan></text><path d="M878,200 L962,200" fill="none" stroke="#6cdbb1" stroke-width="2" marker-end="url(#arr-6cdbb1)"/><text x="921" y="183" fill="#6cdbb1" font-size="13" font-weight="400" text-anchor="middle"><tspan x="921" dy="0">Allowed</tspan></text><path d="M437,245 L437,311" fill="none" stroke="#f397a8" stroke-width="2" marker-end="url(#arr-f397a8)"/><rect x="325" y="319" width="224" height="78" rx="12" fill="#422c36" stroke="#f397a8" stroke-width="1.4"/><text x="437" y="349" fill="#ecf3f8" font-size="23" font-weight="600" text-anchor="middle"><tspan x="437" dy="0">401</tspan></text><text x="437" y="376" fill="#f397a8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="437" dy="0">No valid credentials</tspan></text><path d="M762,245 L762,311" fill="none" stroke="#f397a8" stroke-width="2" marker-end="url(#arr-f397a8)"/><rect x="650" y="319" width="224" height="78" rx="12" fill="#422c36" stroke="#f397a8" stroke-width="1.4"/><text x="762" y="349" fill="#ecf3f8" font-size="23" font-weight="600" text-anchor="middle"><tspan x="762" dy="0">403</tspan></text><text x="762" y="376" fill="#f397a8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="762" dy="0">Insufficient permission</tspan></text><text x="437" y="288" fill="#f397a8" font-size="13" font-weight="400" text-anchor="end"><tspan x="437" dy="0">Invalid</tspan></text><text x="762" y="288" fill="#f397a8" font-size="13" font-weight="400" text-anchor="end"><tspan x="762" dy="0">Denied</tspan></text><text x="560" y="115" fill="#aabcc8" font-size="17" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Example: being signed in does not automatically let you delete a report.</tspan></text><text x="560" y="432" fill="#aabcc8" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">Typical protected-HTTP-resource behavior; applications may also redirect users to a login page.</tspan></text></g></svg>